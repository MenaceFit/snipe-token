    emoji: "🎰"
  - name: "INSIDER WATCH"
    emoji: "👁️"

# ---- Trade Detection ----
trade_detection:
  min_usd_value: 10          # Ignore trades below this USD value
  stablecoin_threshold: 0.99  # Price ratio to consider a token a stablecoin
  max_price_age_seconds: 30   # Max age of cached price
  classify_unknown: true      # Create UNKNOWN trades when uncertain

# ---- Position Engine ----
position_engine:
  cost_method: "average_cost"  # average_cost | fifo
  include_gas_in_cost: true
  include_fees_in_cost: true
  dust_threshold_usd: 1        # Positions smaller than this are considered dust

# ---- PnL Engine ----
pnl_engine:
  update_unrealized_interval: 60   # seconds
  price_sources:
    - dexscreener
    - birdeye
    - coingecko
  fallback_on_price_failure: true

# ---- Telegram ----
telegram:
  max_message_length: 4096
  position_update_cooldown: 300      # seconds between updates for same position
  position_update_min_change: 5.0    # % change required to trigger update
  alert_queue_max_size: 1000
  max_retries: 3
  retry_delay: 5

# ---- Copy Trading ----
copy_trading:
  paper:
    enabled: true
    default_amount_usd: 100
    auto_follow_score_threshold: 85
  live:
    enabled: false   # Must be explicitly enabled
    emergency_stop: false
    defaults:
      max_trade_size_usd: 100
      max_daily_loss_usd: 500
      max_position_size_usd: 200
      copy_percent: 5
      max_slippage_bps: 300
      max_gas_gwei: 100
      min_liquidity_usd: 50000
      min_market_cap_usd: 500000
      max_token_age_days: null      # null = no restriction
      require_lock: false

# ---- Smart Money Score ----
smart_money:
  min_trades_for_score: 10
  min_trades_for_high_confidence: 50
  score_weights:
    win_rate: 0.25
    average_roi: 0.25
    consistency: 0.15
    risk_management: 0.15
    trade_frequency: 0.10
    drawdown: 0.10
  cluster_detection:
    enabled: true
    time_window_minutes: 5
    min_shared_tokens: 3
    min_confidence: 0.7

# ---- Risk Engine ----
risk:
  max_buy_tax_percent: 10
  max_sell_tax_percent: 10
  min_liquidity_usd: 10000
  max_top_holder_percent: 50
  check_honeypot: true
  check_contract_source: true
  simulate_trade: true
  block_unverified_contracts: false   # true = only trade verified contracts

# ---- Monitoring ----
monitoring:
  latency_warning_ms: 1000
  latency_critical_ms: 5000
  websocket_reconnect_delay: 1    # seconds, exponential backoff base
  websocket_max_reconnect_delay: 60
  rpc_timeout: 10
  rpc_max_retries: 3
  health_check_interval: 30

# ---- Analytics ----
analytics:
  ranking_update_interval: 3600   # seconds
  consensus_min_wallets: 2
  consensus_time_window: 3600     # seconds, window to detect consensus buys
  top_trades_min_roi: 50          # % minimum ROI for top trades feed
  top_trades_min_usd: 100         # Minimum investment for top trades feed

# ---- Performance ----
performance:
  max_concurrent_chains: 10
  max_concurrent_wallet_subscriptions: 500
  event_queue_size: 10000
  worker_concurrency: 10
  db_pool_size: 20
  db_max_overflow: 40
  redis_pool_size: 20
